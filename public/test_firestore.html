<!DOCTYPE html>
<html>

<head>
    <title>Firestore Test</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        pre {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h1>Firestore Connectivity Test</h1>
    <div>
        <label>Scan ID: </label>
        <input type="text" id="scanId" value="b14d3f9a-3f32-459a-8332-462af154f577" style="width: 300px;">
        <button onclick="checkScan()">Check Status</button>
    </div>

    <div id="status">Waiting...</div>
    <pre id="output"></pre>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        await import('/runtime-config.js');

        const firebaseConfig = window.__APP_CONFIG__?.firebase;
        if (!firebaseConfig?.apiKey) {
            throw new Error('Missing Firebase runtime config. Configure /runtime-config.js before using this test page.');
        }

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.checkScan = async () => {
            const scanId = document.getElementById('scanId').value;
            const statusDiv = document.getElementById('status');
            const outputPre = document.getElementById('output');

            statusDiv.innerHTML = "Checking...";
            statusDiv.className = "";
            outputPre.innerText = "";

            try {
                const docRef = doc(db, "scans", scanId);

                // Try simple get() first
                console.log("Attempting getDoc...");
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    console.log("Document data:", data);

                    statusDiv.innerHTML = "SUCCESS: Document found!";
                    statusDiv.className = "success";

                    if (data.results && data.results.smpl_mesh_uri) {
                        statusDiv.innerHTML += "<br>Found SMPL Mesh URI! Testing download...";
                        const uri = data.results.smpl_mesh_uri;

                        try {
                            let url = uri;
                            // Basic check if it's a gs:// URI (proxy needed) or http
                            if (uri.startsWith('gs://')) {
                                outputPre.innerText += "\n[WARNING] URI is gs:// format. Cannot download directly without Firebase SDK auth.\nURI: " + uri;
                                statusDiv.innerHTML += "<br><span class='error'>Cannot test gs:// URI directly here (needs SDK). Check console.</span>";
                            } else {
                                outputPre.innerText += "\nTesting HTTP download from: " + uri;
                                const resp = await fetch(uri);
                                if (resp.ok) {
                                    const text = await resp.text();
                                    statusDiv.innerHTML += "<br><span class='success'>MESH DOWNLOAD SUCCESS! Size: " + text.length + " bytes</span>";
                                } else {
                                    statusDiv.innerHTML += "<br><span class='error'>MESH DOWNLOAD FAILED: " + resp.status + " " + resp.statusText + "</span>";
                                }
                            }
                        } catch (e) {
                            statusDiv.innerHTML += "<br><span class='error'>DOWNLOAD ERROR: " + e.message + "</span>";
                        }
                    } else {
                        statusDiv.innerHTML += "<br>No SMPL Mesh URI found yet.";
                    }

                    const simplifiedData = {
                        status: data.status,
                        steps: data.steps,
                        results_keys: data.results ? Object.keys(data.results) : [],
                        mediapipe_keys: data.results?.mediapipe_data ? Object.keys(data.results.mediapipe_data) : [],
                        has_angles: !!(data.results?.mediapipe_data?.angles)
                    };

                    outputPre.innerText = JSON.stringify(simplifiedData, null, 2);
                } else {
                    statusDiv.innerHTML = "Document found but waiting for data... (exists=false)";
                    // Try waiting with onSnapshot
                    onSnapshot(docRef, (snap) => {
                        if (snap.exists()) {
                            statusDiv.innerHTML = "SUCCESS: Document appeared via snapshot!";
                            statusDiv.className = "success";
                            outputPre.innerText = JSON.stringify(snap.data(), null, 2);
                        } else {
                            statusDiv.innerHTML = "Document does not exist yet.";
                        }
                    }, (err) => {
                        console.error(err);
                        statusDiv.innerHTML = "SNAPSHOT ERROR: " + err.message;
                        statusDiv.className = "error";
                    });
                }
            } catch (e) {
                console.error("Error:", e);
                statusDiv.innerHTML = "ERROR: " + e.message;
                statusDiv.className = "error";
                if (e.message.includes("permission-denied")) {
                    outputPre.innerText = "\nMake sure Firestore Security Rules allow read access!\nTry: allow read: if true; (temporarily)";
                }
            }
        };
    </script>
</body>

</html>
